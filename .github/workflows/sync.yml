name: Scheduled Sync
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (GitHub may delay under load)
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write             # to commit updated state.json

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py
      - name: Persist state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "wallet-monitor-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          else
            echo "no state change"
          fi
